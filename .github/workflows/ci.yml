name: CI

# The CMS plugin's test site links the CMS's packages from a checkout next to this repo
# (../nextjs-cms), as on a developer's machine, so each job checks out both.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: otw-db

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18', '24']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: conf
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest" --health-interval 3s
          --health-timeout 5s --health-retries 40
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: conf
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 3s
          --health-timeout 5s --health-retries 40
    env:
      TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:5432/postgres
      TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/conf
      TEST_MARIADB_URL: mariadb://root:test@127.0.0.1:3307/conf
    steps:
      - uses: actions/checkout@v5
        with:
          path: otw-db
      - uses: actions/checkout@v5
        with:
          repository: OTWSRL/otw-cms
          path: nextjs-cms
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: otw-db/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: '*/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
        working-directory: nextjs-cms
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
    env:
      E2E_POSTGRES_URL: postgres://postgres:e2e@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          path: otw-db
      - uses: actions/checkout@v5
        with:
          repository: OTWSRL/otw-cms
          path: nextjs-cms
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: otw-db/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: '*/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
        working-directory: nextjs-cms
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The standalone server's suite, the Next.js example's, then the CMS plugin's.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            otw-db/test-results/
            otw-db/examples/*/test-results/
